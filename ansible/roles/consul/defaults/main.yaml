---
# Consul role default variables

consul_manage_user: true
consul_manage_group: true
consul_user: "consul"
consul_group: "consul"

consul_binary_version: "2.0.1"

consul_config_dir: "/etc/consul.d"
consul_data_dir: "/opt/consul/data"
consul_log_dir: "/var/log/consul"
consul_log_file: "/var/log/consul/consul.log"
consul_tls_dir: "/etc/consul.d/tls"
consul_run_path: "/run/consul"
consul_pid_file: "{{ consul_run_path }}/consul.pid"

consul_service_name: "consul"

# Consul datacenter / domain settings
consul_datacenter: "dc1"
consul_domain: "global"
# consul_node_name is the Consul agent name written to node_name in consul.hcl.
# consul_servers.yaml overrides this to "consul-server-N" (1-based group index).
# consul_clients.yaml overrides this to "consul-client-N" (1-based group index).
# Falls back to inventory_hostname when not set by a playbook.
consul_node_name: "{{ inventory_hostname }}"

# Logging
consul_log_level: "INFO"
consul_enable_debug: false

# Server configuration
consul_server_enabled: false
consul_server_bootstrap_expect: 3
consul_ui_enabled: true

# Client configuration
consul_client_enabled: false

# Network addresses
# consul_bind_addr defaults to the default IPv4 address discovered by Ansible
consul_bind_addr: "{{ ansible_facts['default_ipv4']['address'] }}"
# consul_client_addr controls the address Consul listens on for HTTP/DNS/gRPC.
# 0.0.0.0 makes the UI and API reachable on all interfaces; restrict in production.
consul_client_addr: "0.0.0.0"

# Ports (Consul defaults)
consul_port_http: 8500
consul_port_https: -1
consul_port_grpc: 8502
consul_port_grpc_tls: -1
consul_port_serf_lan: 8301
consul_port_serf_wan: 8302
consul_port_server: 8300
consul_port_dns: 8600

# Retry join — used when consul_cloud_auto_join_enabled is false
consul_retry_join: []

# Cloud auto-join (AWS)
consul_cloud_auto_join_enabled: false
consul_cloud_auto_join_tag_key: "AutoJoinRole"
consul_cloud_auto_join_tag_value: "server"

# ACL configuration
consul_acl_enabled: false
consul_acl_default_policy: "deny"
consul_acl_enable_token_persistence: true
# Optional ACL tokens written into acl.tokens{} in consul.hcl.
# Set consul_acl_agent_token per host (node-identity token); set
# consul_acl_dns_token to the shared DNS token. Both are empty by default
# and the tokens{} block is omitted from consul.hcl when both are unset.
consul_acl_agent_token: ""
consul_acl_dns_token: ""

# TLS configuration
consul_tls_enabled: false

# Gossip encryption
# Generate a key with: consul keygen
consul_gossip_encryption_enabled: false
consul_gossip_encryption_key: ""

# Connect (service mesh)
consul_connect_enabled: false

# Performance tuning
consul_performance:
  raft_multiplier: 1
  leave_drain_time: "5s"
  rpc_hold_timeout: "7s"

# Systemd service tuning
consul_systemd_restart: "on-failure"
consul_systemd_restart_sec: 5
consul_systemd_limit_nofile: 65536

# Telemetry
consul_telemetry_enabled: false
consul_telemetry_prometheus_retention_time: "30s"
