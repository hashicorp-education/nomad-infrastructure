---
# nomad_consul role argument specifications (Ansible 2.11+)
# Validates role input variables at play time.

argument_specs:
  main:
    short_description: Configure Consul ACL resources for Nomad integration
    description:
      - Creates Consul ACL policies, tokens, a JWT auth method, binding rules,
        and a role to integrate Nomad with Consul using Nomad Workload Identities.
      - Requires Consul ACL to be bootstrapped before running
        (consul_acl_bootstrap.yaml must have completed successfully).
      - All Consul ACL operations are delegated to the first server and run
        exactly once per cluster via a sentinel file.
      - Saves Nomad agent Consul token SecretIDs to the Ansible control machine
        for use by the Nomad role.
    author:
      - nomad-infra

    options:
      nomad_consul_http_addr:
        type: str
        required: false
        default: "http://127.0.0.1:8500"
        description: Consul HTTP API address.

      nomad_consul_bin_path:
        type: str
        required: false
        default: "/usr/local/bin/consul"
        description: Path to the Consul binary on the remote server.

      nomad_consul_bootstrap_secret_id_file:
        type: str
        required: false
        description: >-
          Local path to the file containing the Consul bootstrap SecretID.
          Written by consul_acl_bootstrap.yaml. Defaults to
          {{ inventory_dir }}/tokens/consul-bootstrap-secret-id.txt.

      nomad_consul_bootstrapped_file:
        type: str
        required: false
        description: >-
          Remote path to the sentinel file that indicates a successful bootstrap.
          Defaults to /opt/consul/data/nomad-consul-bootstrapped.true.

      nomad_consul_server_policy_name:
        type: str
        required: false
        default: "nomad-server-policy"
        description: Name of the Consul ACL policy for Nomad server agents.

      nomad_consul_client_policy_name:
        type: str
        required: false
        default: "nomad-client-policy"
        description: Name of the Consul ACL policy for Nomad client agents.

      nomad_consul_tasks_policy_name:
        type: str
        required: false
        default: "nomad-tasks-policy"
        description: Name of the Consul ACL policy for Nomad task workload identities.

      nomad_consul_auth_method_name:
        type: str
        required: false
        default: "nomad-workloads"
        description: Name of the Consul JWT auth method for Nomad workload identities.

      nomad_consul_jwks_url:
        type: str
        required: false
        description: >-
          URL of the Nomad JWKS endpoint used by Consul to validate workload
          identity JWTs. Must be reachable by all Consul servers. Defaults to
          the first Nomad server's HTTP address. In production, use a load
          balancer or DNS entry covering multiple Nomad agents.

      nomad_consul_tasks_role_name:
        type: str
        required: false
        default: "nomad-tasks-default"
        description: >-
          Name of the Consul ACL role for Nomad tasks in the default Nomad
          namespace. Create additional roles for non-default namespaces.
