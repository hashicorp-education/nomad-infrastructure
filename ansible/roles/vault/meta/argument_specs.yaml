---
# Vault role argument specifications (Ansible 2.11+)

argument_specs:
  main:
    short_description: Install and configure a self-hosted Vault server
    description:
      - Installs the Vault binary via the hashicorp_release role and writes
        an HCL agent configuration under vault_config_dir.
      - Uses Raft integrated storage — no external storage backend or
        Consul dependency.
      - Does not initialize or unseal Vault; that is handled by
        ansible/playbooks/vault_servers.yaml post_tasks.
    author:
      - nomad-infra

    options:
      vault_binary_version:
        type: str
        required: false
        default: "1.20.1"
        description: Vault release version to install.

      vault_node_name:
        type: str
        required: false
        default: "{{ inventory_hostname }}"
        description: Raft node_id for this Vault server.

      vault_tls_enabled:
        type: bool
        required: false
        default: true
        description: Enable TLS for Vault's HTTP API and cluster listener.

      vault_api_port:
        type: int
        required: false
        default: 8200
        description: Port for Vault's HTTP API listener.

      vault_cluster_port:
        type: int
        required: false
        default: 8201
        description: Port for Vault's Raft cluster listener.

      vault_ui_enabled:
        type: bool
        required: false
        default: true
        description: Enable the Vault web UI.

      vault_cloud_auto_join_enabled:
        type: bool
        required: false
        default: false
        description: >-
          When true, Raft retry_join uses AWS cloud auto-join instead of a
          static list of server private IPs.

      vault_cloud_auto_join_tag_key:
        type: str
        required: false
        default: "AutoJoinRole"
        description: AWS tag key for auto-join.

      vault_cloud_auto_join_tag_value:
        type: str
        required: false
        default: "server"
        description: AWS tag value for auto-join.
