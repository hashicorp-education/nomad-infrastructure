---
# File operations tasks

- name: Copy files from local
  ansible.builtin.include_tasks: file_copy_local.yaml
  loop: "{{ helper_file_copy_local }}"
  when: helper_file_copy_local | length > 0

- name: Write files from templates
  ansible.builtin.include_tasks: file_write_template.yaml
  loop: "{{ helper_file_write_template }}"
  when: helper_file_write_template | length > 0

- name: Write files from content
  ansible.builtin.include_tasks: file_write_content.yaml
  loop: "{{ helper_file_write_content }}"
  when: helper_file_write_content | length > 0

- name: Write files from content locally
  ansible.builtin.copy:
    content: "{{ item['content'] }}"
    dest: "{{ item['dst'] }}"
    mode: "{{ item['mode'] | default('0644') }}"
  loop: "{{ helper_file_write_content_local }}"
  delegate_to: 127.0.0.1
  run_once: true
  when: helper_file_write_content_local | length > 0


