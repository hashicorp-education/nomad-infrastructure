---
# APT package installation tasks

- name: Install APT packages
  become: true
  ansible.builtin.apt:
    name: "{{ item }}"
    state: present
    update_cache: true
  loop: "{{ helper_apt_packages }}"
  when: helper_apt_packages | length > 0


