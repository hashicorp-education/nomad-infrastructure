---
# CNI plugins installation tasks

- name: Create CNI plugins directory
  become: true
  ansible.builtin.file:
    path: "{{ cni_plugins_path }}"
    state: directory
    mode: "0755"

- name: Create CNI config directory
  become: true
  ansible.builtin.file:
    path: "{{ cni_plugins_config_path }}"
    state: directory
    mode: "0755"

- name: Download CNI plugins
  ansible.builtin.get_url:
    url: "{{ cni_plugins_url }}"
    dest: "/tmp/cni-plugins.tgz"
    mode: "0600"
  register: cni_plugins_file

- name: Extract CNI plugins
  become: true
  ansible.builtin.unarchive:
    remote_src: true
    src: "{{ cni_plugins_file.dest }}"
    dest: "{{ cni_plugins_path }}"
    mode: "0755"

- name: Remove CNI plugins tar file
  ansible.builtin.file:
    path: "{{ cni_plugins_file.dest }}"
    state: absent


