---
# CNI plugins role tasks

- name: Check if CNI plugins directory exists
  ansible.builtin.stat:
    path: "{{ cni_plugins_path }}"
  register: cni_plugins_dir_stat

- name: Install CNI plugins
  ansible.builtin.import_tasks: install.yaml
  when: not cni_plugins_dir_stat.stat.exists

- name: Check if consul-cni plugin exists
  ansible.builtin.stat:
    path: "{{ cni_plugins_path }}/consul-cni"
  register: consul_cni_stat
  when: consul_cni_enabled | default(false)

- name: Install consul-cni plugin
  ansible.builtin.import_tasks: install_consul_cni.yaml
  when: consul_cni_enabled | default(false) and not consul_cni_stat.stat.exists

- name: Write CNI configuration files
  become: true
  ansible.builtin.copy:
    content: "{{ item.content }}"
    dest: "{{ cni_plugins_config_path }}/{{ item.name }}"
    mode: "0644"
  loop: "{{ cni_configs }}"
  when: cni_configs | length > 0


