---
# nomad_vault role argument specifications (Ansible 2.11+)

argument_specs:
  main:
    short_description: Configure Vault JWT auth method for Nomad workload identity
    description:
      - Enables a Vault JWT auth method trusting Nomad's JWKS endpoint,
        creates an ACL policy and JWT role for Nomad task workload
        identities, and enables a KV v2 secrets mount for Nomad workloads.
      - Requires ansible/playbooks/vault_servers.yaml to have already
        initialized and unsealed Vault.
      - Idempotent via a sentinel file on the first Vault/Nomad server.
    author:
      - nomad-infra

    options:
      nomad_vault_addr:
        type: str
        required: false
        default: "https://127.0.0.1:8200"
        description: Address of the Vault instance reachable from the first Nomad server.

      nomad_vault_bin_path:
        type: str
        required: false
        default: "/usr/local/bin/vault"
        description: Path to the Vault binary on the remote server.

      nomad_vault_cacert:
        type: str
        required: false
        default: "/etc/vault.d/.tls/ca.crt"
        description: CA certificate used to validate the local Vault TLS listener.

      nomad_vault_root_token_file:
        type: str
        required: false
        default: "{{ inventory_dir }}/tokens/vault-root-token-secret-id.txt"
        description: Local path to the Vault root token written by vault_servers.yaml.

      nomad_vault_wi_bootstrapped_file:
        type: str
        required: false
        default: "/opt/vault/data/nomad-vault-wi-bootstrapped.true"
        description: Sentinel file marking the bootstrap as complete.

      nomad_vault_staging_dir:
        type: str
        required: false
        default: "/tmp/nomad-vault-acl"
        description: Remote directory used to stage policy and auth-method files (removed after use).

      nomad_vault_auth_method_path:
        type: str
        required: false
        default: "jwt-nomad"
        description: Path at which the Vault JWT auth method is enabled.

      nomad_vault_jwks_url:
        type: str
        required: true
        description: JWKS URL Vault uses to validate Nomad workload identity JWTs.

      nomad_vault_jwks_ca_cert:
        type: str
        required: false
        default: ""
        description: PEM CA certificate content used to validate the JWKS endpoint's TLS certificate.

      nomad_vault_policy_name:
        type: str
        required: false
        default: "nomad-workloads-policy"
        description: Name of the Vault ACL policy created for Nomad task workload identities.

      nomad_vault_role_name:
        type: str
        required: false
        default: "nomad-workloads"
        description: Name of the Vault JWT role created for Nomad task workload identities.

      nomad_vault_role_bound_audiences:
        type: str
        required: false
        default: "vault.io"
        description: >-
          Audience the Vault JWT role accepts. Must match
          nomad_vault_default_identity_aud in the nomad role.

      nomad_vault_role_ttl:
        type: str
        required: false
        default: "1h"
        description: Token TTL issued by the Vault JWT role.

      nomad_vault_secrets_mount:
        type: str
        required: false
        default: "secret"
        description: Path of the KV v2 secrets engine enabled for Nomad workloads.
