---
# Nomad role default variables

nomad_user: "root"
nomad_group: "root"

nomad_binary_version: "2.0.4"

# nomad_node_name is written to the name parameter in nomad.hcl.
# nomad_servers.yaml overrides this to "nomad-server-N" (1-based group index).
# nomad_clients.yaml overrides this to "nomad-client-N" (1-based group index).
# Falls back to inventory_hostname when not set by a playbook.
nomad_node_name: "{{ inventory_hostname }}"

nomad_config_dir: "/etc/nomad.d"
nomad_data_dir: "/opt/nomad/data"
nomad_plugin_dir: "/opt/nomad/plugins"

nomad_service_name: "nomad"

# Nomad server configuration
nomad_server_enabled: false
nomad_server_bootstrap_expect: 3

# Nomad client configuration
nomad_client_enabled: false
nomad_client_servers: []

# ACL configuration
nomad_acl_enabled: false

# Telemetry configuration
nomad_telemetry_enabled: false
nomad_telemetry_prometheus_metrics: false

# Logging configuration
nomad_log_level: "DEBUG"
nomad_log_file: "/var/log/nomad.log"
nomad_log_include_location: false
nomad_enable_debug: false

# Cloud auto-join configuration (AWS)
nomad_cloud_auto_join_enabled: false
nomad_cloud_auto_join_tag_key: "AutoJoinRole"
nomad_cloud_auto_join_tag_value: "server"

# TLS configuration
nomad_tls_enabled: true

# Consul integration configuration
#
# nomad_consul_integration_enabled: enables the consul { address token } block.
#   Set to true after running consul_nomad_service_discovery.yaml.
#
# nomad_consul_workload_identity_enabled: adds service_identity + task_identity
#   blocks inside the consul block (Nomad servers only, Nomad 1.7+).
#   Set to true after running consul_nomad_workload_identity.yaml.
nomad_consul_integration_enabled: false
nomad_consul_workload_identity_enabled: false

# Address of the local Consul HTTP API
nomad_consul_address: "127.0.0.1:8500"

# Consul ACL token for this Nomad agent.
# For servers: set to the SecretID from nomad-consul-server-secret-id.txt
# For clients: set to the SecretID from nomad-consul-client-secret-id.txt
# Leave empty when nomad_consul_integration_enabled is false.
nomad_consul_agent_token: ""

# Nomad server consul block: default workload identity for service registration.
# Nomad servers inject this identity into jobs that register Consul services.
# The audience must match the BoundAudiences in the Consul JWT auth method.
nomad_consul_service_identity_aud: "consul.io"
nomad_consul_service_identity_ttl: "1h"

# Nomad server consul block: default workload identity for task data access.
# Nomad servers inject this identity into tasks that use a consul block.
nomad_consul_task_identity_aud: "consul.io"
nomad_consul_task_identity_ttl: "1h"

# Consul token fallback for client template blocks (Nomad 2.0.4+).
# Set to true when using Consul integration WITHOUT workload identity
# (deploy_consul_nomad_sd.yaml scenario) and jobs use template blocks that
# read Consul KV or services. Corresponds to client.template.use_client_consul_token.
# Has no effect unless nomad_consul_integration_enabled is true and
# nomad_consul_workload_identity_enabled is false.
nomad_client_use_consul_token: false

# Consul Connect (service mesh) gRPC integration — Nomad clients only.
# Set to true after enabling `connect { enabled = true }` and grpc_tls on the
# Consul agents (consul_nomad_service_mesh.yaml). Adds grpc_address/grpc_ca_file
# to the client's consul{} block so Envoy sidecars can reach Consul over TLS.
nomad_consul_connect_enabled: false
nomad_consul_grpc_address: "127.0.0.1:8503"
nomad_consul_grpc_ca_file: "{{ nomad_config_dir }}/.tls/ca.crt"

# Vault integration configuration (Nomad 1.7+ workload identity)
#
# nomad_vault_integration_enabled: enables the top-level vault {} block.
#   Set to true after running vault_servers.yaml and
#   nomad_vault_integration.yaml.
#
# nomad_vault_workload_identity_enabled: adds jwt_auth_backend_path and
#   default_identity to the vault block, so Nomad injects a Vault workload
#   identity JWT into every task automatically instead of requiring a static
#   Vault token. This is the only supported mode in this repo — there is no
#   legacy static-token fallback (unlike the Consul integration, which
#   supports both modes).
nomad_vault_integration_enabled: false
nomad_vault_workload_identity_enabled: false

# Address of the Vault cluster this agent talks to. Nomad servers (which run
# Vault locally per vault_servers.yaml) should use their own loopback address;
# Nomad clients (which do not run Vault) point at the first Vault server.
nomad_vault_address: "https://127.0.0.1:8200"

# Vault JWT auth method path configured by nomad_vault_integration.yaml.
nomad_vault_jwt_auth_backend_path: "jwt-nomad"

# Default workload identity Nomad injects into every task for Vault access.
# The audience must match bound_audiences in the Vault JWT role.
nomad_vault_default_identity_aud: "vault.io"
nomad_vault_default_identity_ttl: "1h"
