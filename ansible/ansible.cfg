[defaults]
inventory = inventory.ini
host_key_checking = False
retry_files_enabled = False
# Use per-user home dir for remote temp files so that tasks running with
# become: false (as the SSH user) and tasks running as root each get their
# own ~/.ansible/tmp path and never collide on a shared fixed directory.
remote_tmp = ~/.ansible/tmp
gathering = smart
fact_caching = jsonfile
fact_caching_connection = /tmp/ansible_facts
fact_caching_timeout = 3600
roles_path = ~/.ansible/roles:./roles:/usr/share/ansible/roles:/etc/ansible/roles
collections_paths = ~/.ansible/collections:/usr/share/ansible/collections
private_key_file = ssh_key.pem
inject_facts_as_vars = False

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False

[ssh_connection]
pipelining = True
# IdentitiesOnly=yes restricts auth attempts to the explicitly configured
# identity file (private_key_file / ansible_ssh_private_key_file) instead of
# also offering every key already loaded in the local ssh-agent. Without it,
# a long-lived agent that has accumulated keys from past terraform apply
# runs (each generating a new ssh_key.pem) will offer all of them first,
# and a cloud host's sshd (MaxAuthTries, default 6) can disconnect before
# authentication ever reaches the correct key - "Too many authentication
# failures" even though the right key is configured correctly.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no -o IdentitiesOnly=yes

