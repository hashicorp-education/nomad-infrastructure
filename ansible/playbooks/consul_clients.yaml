---
# Playbook: consul_clients.yaml
# Description: Install Docker and configure Consul v2.x client agents on the
#              [clients] group from the Terraform-generated inventory.ini.
#              Run consul_servers.yaml first — clients join the server cluster
#              at startup.
# Requirements:
#   - Ansible 2.14+
#   - geerlingguy.docker role (ansible-galaxy install -r requirements.yaml)
#   - Target hosts: Ubuntu 20.04+ (Debian family)
#   - Consul server cluster must be running before this playbook executes
# Variables:
#   - consul_binary_version: Consul release to install (default: 2.0.1)
#   - consul_datacenter: Consul datacenter name (default: dc1)
#   - consul_cloud_auto_join_enabled: enable AWS auto-join (default: true here)
#   - consul_acl_enabled: enable ACLs (default: false)
#   - consul_tls_enabled: enable TLS (default: true)
# Usage:
#   ansible-playbook -i inventory.ini consul_clients.yaml
#   ansible-playbook -i inventory.ini consul_clients.yaml --tags consul_config

- name: Configure Consul clients
  hosts: clients
  become: true
  gather_facts: true

  vars:
    # --- Consul role variables ---
    consul_server_enabled: false
    consul_datacenter: "dc1"
    consul_log_level: "INFO"
    # Cloud auto-join: clients discover servers via the same AutoJoinRole tag
    consul_cloud_auto_join_enabled: true
    consul_cloud_auto_join_tag_key: "AutoJoinRole"
    consul_cloud_auto_join_tag_value: "server"
    # ACL is disabled by default; enable for production. TLS is enabled by default.
    consul_acl_enabled: false
    consul_tls_enabled: true
    consul_port_https: 8443
    consul_connect_enabled: false

  pre_tasks:
  # The consul role normally creates this user/group, but the TLS cert helper
  # role below (which chowns files to consul_user/consul_group) runs before
  # the consul role. Create the system account early so chown succeeds.
  - name: Create consul system group
    ansible.builtin.group:
      name: "{{ consul_group }}"
      system: true
      state: present
    when: consul_manage_group | bool

  - name: Create consul system user
    ansible.builtin.user:
      name: "{{ consul_user }}"
      group: "{{ consul_group }}"
      system: true
      shell: /usr/sbin/nologin
      create_home: false
      state: present
    when: consul_manage_user | bool

  roles:
  - role: common
    vars:
      common_hostname: "{{ inventory_hostname }}"

  # Install Docker on every node before Consul
  - role: geerlingguy.docker
    become: true
    vars:
      docker_users:
      - "{{ ansible_user }}"

  - role: helper
    vars:
      helper_apt_packages:
      - jq
      - net-tools
      - unzip
      - nano
      - curl

  - role: tls
    when: consul_tls_enabled
    tls_self_signed_generate:
    - agent-name: "{{ inventory_hostname }}"
      ip: "{{ ansible_facts['default_ipv4']['address'] }}"
      dns: "client.{{ consul_datacenter }}.{{ consul_domain }}"

  - role: helper
    when: consul_tls_enabled | bool
    vars:
      helper_file_copy_local:
      - src: "{{ inventory_dir }}/.tls/ca.pem"
        dst: "{{ consul_tls_dir }}/ca.pem"
        owner: "{{ consul_user }}"
        group: "{{ consul_group }}"
        mode: "0644"
        notify: "Restart consul"
      - src: "{{ inventory_dir }}/.tls/{{ inventory_hostname }}.pem"
        dst: "{{ consul_tls_dir }}/consul.pem"
        owner: "{{ consul_user }}"
        group: "{{ consul_group }}"
        mode: "0644"
        notify: "Restart consul"
      - src: "{{ inventory_dir }}/.tls/{{ inventory_hostname }}-key.pem"
        dst: "{{ consul_tls_dir }}/consul-key.pem"
        owner: "{{ consul_user }}"
        group: "{{ consul_group }}"
        mode: "0600"
        notify: "Restart consul"

  - role: consul

  post_tasks:
  - name: Wait for Consul HTTP API to be ready
    ansible.builtin.wait_for:
      host: "127.0.0.1"
      port: 8500
      delay: 5
      timeout: 60
      state: started

  - name: Display Consul client status
    ansible.builtin.debug:
      msg: "Consul client configured on {{ inventory_hostname }}"
