---
# Playbook to remove all policies from the Consul anonymous token
#
# https://developer.hashicorp.com/consul/docs/secure/acl/token#anonymous-token
#
# The anonymous token (SecretID: "anonymous", AccessorID: 00000000-0000-0000-0000-000000000002)
# cannot be deleted — it is a built-in Consul token. This playbook attaches the
# anonymous-deny ACL policy to it so that unauthenticated requests are explicitly
# denied all permissions.
#
# Prerequisites:
#   - Consul ACL system bootstrapped (consul_acl_bootstrap.yaml completed)
#   - consul-bootstrap-secret-id.txt present in the playbook directory
#
# Usage:
#   ansible-playbook -i inventory.ini consul_acl_deny_anonymous.yaml
#
# Idempotent: re-running is safe. The policy create step silently skips if the
# policy already exists; the token update is always applied.

- name: Remove all policies from Consul anonymous token
  hosts: servers[0]
  gather_facts: false

  vars:
    consul_bin_path: "/usr/local/bin/consul"
    consul_http_addr: "http://127.0.0.1:8500"
    consul_anonymous_accessor_id: "00000000-0000-0000-0000-000000000002"

  tasks:
  - name: Check if Consul is running
    ansible.builtin.wait_for:
      port: 8500
      timeout: 10
    register: consul_running
    failed_when: false

  - name: Fail if Consul is not running
    ansible.builtin.fail:
      msg: "Consul is not running on port 8500."
    when: consul_running.failed

  - name: Check that bootstrap token file exists
    ansible.builtin.stat:
      path: "{{ inventory_dir }}/tokens/consul-bootstrap-secret-id.txt"
    register: token_file
    delegate_to: localhost
    become: false

  - name: Fail if bootstrap token file is missing
    ansible.builtin.fail:
      msg: >
        consul-bootstrap-secret-id.txt not found in {{ inventory_dir }}/tokens.
        Run consul_acl_bootstrap.yaml first.
    when: not token_file.stat.exists

  - name: Read management token
    ansible.builtin.slurp:
      src: "{{ inventory_dir }}/tokens/consul-bootstrap-secret-id.txt"
    register: mgmt_token_raw
    delegate_to: localhost
    become: false
    no_log: true

  - name: Set management token fact
    ansible.builtin.set_fact:
      consul_mgmt_token: "{{ mgmt_token_raw.content | b64decode | trim }}"
    no_log: true

  - name: Copy anonymous-deny policy to server
    ansible.builtin.copy:
      src: "{{ playbook_dir }}/../files/consul/consul-anonymous-deny.hcl"
      dest: "/tmp/consul-anonymous-deny.hcl"
      mode: "0600"
    become: true

  - name: Create anonymous-deny Consul ACL policy
    ansible.builtin.command: >
      {{ consul_bin_path }} acl policy create
      -name "anonymous-deny"
      -description "Deny all access for anonymous unauthenticated requests"
      -rules "@/tmp/consul-anonymous-deny.hcl"
    environment:
      CONSUL_HTTP_ADDR: "{{ consul_http_addr }}"
      CONSUL_HTTP_TOKEN: "{{ consul_mgmt_token }}"
    register: policy_create_result
    changed_when: policy_create_result.rc == 0
    failed_when:
      - policy_create_result.rc != 0
      - "'already exists' not in policy_create_result.stderr"
    no_log: true

  - name: Apply anonymous-deny policy to anonymous token
    ansible.builtin.command: >
      {{ consul_bin_path }} acl token update
      -accessor-id {{ consul_anonymous_accessor_id }}
      -description "Anonymous Token - deny all"
      -policy-name "anonymous-deny"
    environment:
      CONSUL_HTTP_ADDR: "{{ consul_http_addr }}"
      CONSUL_HTTP_TOKEN: "{{ consul_mgmt_token }}"
    register: anon_update_result
    changed_when: anon_update_result.rc == 0

  - name: Remove anonymous-deny policy staging file from server
    ansible.builtin.file:
      path: "/tmp/consul-anonymous-deny.hcl"
      state: absent
    become: true
    no_log: true

  - name: Fail on unexpected update error
    ansible.builtin.fail:
      msg: "consul acl token update failed (rc={{ anon_update_result.rc }}): {{ anon_update_result.stderr }}"
    when: anon_update_result.rc != 0

  - name: Confirm anonymous token policies removed
    ansible.builtin.debug:
      msg:
        - "=========================================="
        - "ANONYMOUS TOKEN POLICY ADDED"
        - "=========================================="
        - ""
        - "Accessor ID : {{ consul_anonymous_accessor_id }}"
        - "Secret ID   : anonymous"
        - ""
        - "anonymous-deny policy added to anonymous token."
        - "Unauthenticated requests will be denied"
        - "(subject to consul_acl_default_policy)."
        - ""
        - "=========================================="
