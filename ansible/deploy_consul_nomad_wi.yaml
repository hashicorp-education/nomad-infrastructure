---
# Playbook: deploy_consul_nomad_wi.yaml
#
# Deploys a Consul cluster and a Nomad cluster integrated for service discovery
# and workload identity:
#   1. Configures all hosts
#   2. Tests Ansible connectivity
#   3. Deploys Consul servers and clients
#   4. Bootstraps Consul ACL
#   5. Configures dnsmasq for Consul DNS forwarding
#   6. Deploys Nomad servers and clients
#   7. Bootstraps Nomad ACL
#   8. Configures Consul-Nomad service discovery (ACL policies and agent tokens)
#   9. Configures Consul-Nomad workload identity (JWT auth method, binding rules,
#      and service_identity/task_identity blocks in Nomad server config)
#
# With workload identity, Nomad workloads exchange a short-lived JWT for a
# scoped Consul ACL token automatically. No static secrets are required in job
# specs or Nomad agent configuration.
#
# To run service discovery only (no workload identity), use
# deploy_consul_nomad_sd.yaml instead.
#
# Usage:
#   ansible-playbook -i inventory.ini deploy_consul_nomad_wi.yaml
#
# Set environment variables after deployment:
#   source ./set-cluster-env.sh
#   source ./unset-cluster-env.sh   # to unset

# ── Configure all hosts and test connectivity ────────────────────────────────

- name: Import common setup
  ansible.builtin.import_playbook: playbooks/common_setup.yaml

# ── Deploy Consul ─────────────────────────────────────────────────────────────

- name: Import Consul server playbook
  ansible.builtin.import_playbook: playbooks/consul_servers.yaml

- name: Import Consul client playbook
  ansible.builtin.import_playbook: playbooks/consul_clients.yaml

- name: Bootstrap Consul ACL
  ansible.builtin.import_playbook: playbooks/consul_acl_bootstrap.yaml

- name: Issue Consul client ACL tokens and reconfigure clients with ACL enabled
  ansible.builtin.import_playbook: playbooks/consul_dns_token.yaml

- name: Configure dnsmasq for Consul DNS forwarding
  ansible.builtin.import_playbook: playbooks/dnsmasq.yaml

- name: Add deny all policy to Consul anonymous token
  ansible.builtin.import_playbook: playbooks/consul_acl_deny_anonymous.yaml

# ── Deploy Nomad ──────────────────────────────────────────────────────────────

- name: Import Nomad server playbook
  ansible.builtin.import_playbook: playbooks/nomad_servers.yaml

- name: Import Nomad client playbook
  ansible.builtin.import_playbook: playbooks/nomad_clients.yaml

- name: Bootstrap Nomad ACL
  ansible.builtin.import_playbook: playbooks/nomad_acl_bootstrap.yaml

# ── Consul-Nomad integration ──────────────────────────────────────────────────

# Phase 1: Consul ACL policies and agent tokens
- name: Configure Consul-Nomad service discovery
  ansible.builtin.import_playbook: playbooks/consul_nomad_service_discovery.yaml

# Phase 2: JWT auth method and workload identity blocks
- name: Configure Consul-Nomad workload identity
  ansible.builtin.import_playbook: playbooks/consul_nomad_workload_identity.yaml

# ── Cluster status summary ────────────────────────────────────────────────────

- name: Import cluster summary
  ansible.builtin.import_playbook: playbooks/cluster_summary.yaml
  vars:
    summary_title: "Consul + Nomad (Service Discovery + Workload Identity) Configuration Complete!"
    summary_show_consul_tokens: true
    summary_show_nomad_tokens: true
    summary_show_sd_tokens: true
    summary_show_consul_env: true
    summary_show_nomad_env: true
    summary_show_consul_ui: true
    summary_show_nomad_ui: true
